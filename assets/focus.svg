<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" font-family="'JetBrains Mono','Fira Code','Courier New',monospace"><defs><linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#00f0ff" stroke-opacity=".07"/></pattern><filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g transform="translate(10,5)"><polygon points="0,0 460,0 480,20 480,110 20,110 0,90" fill="#070b16" stroke="#00f0ff" stroke-opacity=".45"/><polygon points="0,0 460,0 480,20 480,110 20,110 0,90" fill="url(#grid)"/><rect x="0" y="0" width="4" height="90" fill="#ff2bd6" filter="url(#glow)"/><text x="24" y="30" font-size="12" fill="#00f0ff" letter-spacing="2">MOD_01</text><text x="24" y="52" font-size="15" font-weight="700" fill="#e8f7ff" letter-spacing="1">EXTENSIONES DE NAVEGADOR</text><text x="24" y="75" font-size="12" fill="#9fb4c8">Herramientas que automatizan tareas repetitivas y conectan</text><text x="24" y="91" font-size="12" fill="#9fb4c8">plataformas de trabajo.</text><circle cx="455" cy="16" r="3" fill="#00f0ff"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle></g><g transform="translate(510,5)"><polygon points="0,0 460,0 480,20 480,110 20,110 0,90" fill="#070b16" stroke="#00f0ff" stroke-opacity=".45"/><polygon points="0,0 460,0 480,20 480,110 20,110 0,90" fill="url(#grid)"/><rect x="0" y="0" width="4" height="90" fill="#ff2bd6" filter="url(#glow)"/><text x="24" y="30" font-size="12" fill="#00f0ff" letter-spacing="2">MOD_02</text><text x="24" y="52" font-size="15" font-weight="700" fill="#e8f7ff" letter-spacing="1">AUTOMATIZACION</text><text x="24" y="75" font-size="12" fill="#9fb4c8">Menos clics, mas resultados: flujos operativos optimizados</text><text x="24" y="91" font-size="12" fill="#9fb4c8">con codigo.</text><circle cx="455" cy="16" r="3" fill="#00f0ff"><animate attributeName="opacity" values="1;.2;1" dur="1.7s" repeatCount="indefinite"/></circle></g><g transform="translate(10,130)"><polygon points="0,0 460,0 480,20 480,110 20,110 0,90" fill="#070b16" stroke="#00f0ff" stroke-opacity=".45"/><polygon points="0,0 460,0 480,20 480,110 20,110 0,90" fill="url(#grid)"/><rect x="0" y="0" width="4" height="90" fill="#ff2bd6" filter="url(#glow)"/><text x="24" y="30" font-size="12" fill="#00f0ff" letter-spacing="2">MOD_03</text><text x="24" y="52" font-size="15" font-weight="700" fill="#e8f7ff" letter-spacing="1">INTERFACES</text><text x="24" y="75" font-size="12" fill="#9fb4c8">Diseno limpio, moderno y accesible, pensado para quien lo</text><text x="24" y="91" font-size="12" fill="#9fb4c8">usa.</text><circle cx="455" cy="16" r="3" fill="#00f0ff"><animate attributeName="opacity" values="1;.2;1" dur="2.0s" repeatCount="indefinite"/></circle></g><g transform="translate(510,130)"><polygon points="0,0 460,0 480,20 480,110 20,110 0,90" fill="#070b16" stroke="#00f0ff" stroke-opacity=".45"/><polygon points="0,0 460,0 480,20 480,110 20,110 0,90" fill="url(#grid)"/><rect x="0" y="0" width="4" height="90" fill="#ff2bd6" filter="url(#glow)"/><text x="24" y="30" font-size="12" fill="#00f0ff" letter-spacing="2">MOD_04</text><text x="24" y="52" font-size="15" font-weight="700" fill="#e8f7ff" letter-spacing="1">APRENDIZAJE CONTINUO</text><text x="24" y="75" font-size="12" fill="#9fb4c8">Explorando nuevas tecnologias, arquitecturas y buenas</text><text x="24" y="91" font-size="12" fill="#9fb4c8">practicas.</text><circle cx="455" cy="16" r="3" fill="#00f0ff"><animate attributeName="opacity" values="1;.2;1" dur="2.3s" repeatCount="indefinite"/></circle></g></svg>
